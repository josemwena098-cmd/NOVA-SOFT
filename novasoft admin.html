<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><title>ADMIN - TEKNOVA</title>
<style>
  :root { --bg: #050810; --card: #0a0f1e; --accent: #00e5ff; --danger: #ff2d92; --text: #e8eaf6; --border: rgba(0,229,255,0.15); }
  body{background:var(--bg);color:var(--text);font-family:DM Sans;padding:20px}
  .container{max-width:900px;margin:0 auto}
  h1{background:linear-gradient(135deg,var(--accent),#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  input{width:100%;background:var(--card);border:1px solid var(--border);padding:12px;color:var(--text);border-radius:8px;margin-bottom:10px}
  button{background:linear-gradient(135deg,var(--accent),#7c3aed);border:none;padding:12px;border-radius:8px;color:#000;font-weight:700;cursor:pointer;width:100%}
  table{width:100%;margin-top:20px;border-collapse:collapse}
  th,td{border:1px solid var(--border);padding:10px;text-align:left}
  th{background:var(--card);color:var(--accent)}
  .hidden{display:none}
  .btn-del{background:var(--danger);color:#fff;width:auto;padding:8px 12px}
</style>
</head>
<body>
<div class="container">
<h1>⚡ TEKNOVA ADMIN PANEL</h1>

<div id="login">
  <input type="text" id="user" placeholder="Username">
  <input type="password" id="pass" placeholder="Password">
  <button onclick="login()">Ingia</button>
</div>

<div id="panel" class="hidden">
  <h2>Pakia Movie Mpya - Auto Fetch</h2>
  <input type="text" id="link" placeholder="Weka Link ya Google Drive au TMDB">
  <button onclick="addMovie()">➕ Tafuta Info na Ongeza</button>
  <p id="status" style="color:var(--accent);font-size:12px"></p>
  
  <h2 style="margin-top:30px">Dhibiti Movies</h2>
  <table><thead><tr><th>Poster</th><th>Jina</th><th>Action</th></tr></thead><tbody id="table"></tbody></table>
  <button onclick="logout()" style="background:var(--danger);color:#fff;margin-top:20px">Toka</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDPZx7OPw2D6J533kNX-T302RoqPGAPz7k",
  authDomain: "teknova-c9d6e.firebaseapp.com",
  databaseURL: "https://teknova-c9d6e-default-rtdb.firebaseio.com",
  projectId: "teknova-c9d6e",
  storageBucket: "teknova-c9d6e.firebasestorage.app",
  messagingSenderId: "47075576420",
  appId: "1:47075576420:web:29d0588bee99558d866d71"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ADMIN_USER = "TEKNOVA";
const ADMIN_PASS = "novasoft2029";

function login(){
  if(document.getElementById('user').value === ADMIN_USER && document.getElementById('pass').value === ADMIN_PASS){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    loadTable();
  } else alert("Username au Password sio sahihi")
}
function logout(){ location.reload(); }

async function addMovie(){
  const link = document.getElementById('link').value;
  const status = document.getElementById('status');
  if(!link) return alert("Weka link");
  
  status.innerText = "Inatafuta info...";
  let title = "Movie Mpya";
  let poster = "https://via.placeholder.com/300x450";
  let driveId = "";

  // 1. KAMA NI GOOGLE DRIVE LINK
  if(link.includes("drive.google.com")){
    driveId = link.match(/[-\w]{25,}/)[0];
    // Jina linachukuliwa kutoka kwa mtu
    title = prompt("Nimepata ID. Weka jina la movie:") || "Movie Mpya";
    // Poster weka default au mtu aongeze baadaye
  }
  
  // 2. KAMA NI TMDB LINK
  if(link.includes("themoviedb.org")){
    const movieId = link.split('/movie/')[1].split('-')[0];
    const res = await fetch(`https://api.themoviedb.org/3/movie/${movieId}?api_key=1a2b3c4d5e6f7g8h9i0j&language=sw`);
    const data = await res.json();
    title = data.title;
    poster = "https://image.tmdb.org/t/p/w500" + data.poster_path;
    driveId = prompt("Weka ID ya Google Drive ya movie hii:") || "";
  }

  db.ref('movies').push({title,poster,driveId});
  status.innerText = "✅ Movie imeongezwa!";
  document.getElementById('link').value = "";
}

function loadTable(){
  db.ref('movies').on('value',snap=>{
    let html='';
    snap.forEach(c=>{
      const d=c.val();
      html+=`<tr><td><img src="${d.poster}" width="50"></td><td>${d.title}</td><td><button class="btn-del" onclick="del('${c.key}')">Futa</button></td></tr>`
    });
    document.getElementById('table').innerHTML=html;
  })
}
function del(key){ if(confirm("Futa movie?")) db.ref('movies/'+key).remove(); }
</script>
</body>
</html>
