<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEKNOVA MOVIES - Pakua Bure</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { 
    --bg: #0a0a0a;           
    --card: #121212;         
    --accent: #D4AF37;       /* DHABU */
    --accent2: #B8860B;      
    --text: #f5f5f5;         
    --border: rgba(212,175,55,0.2); 
  }

  *{margin:0;padding:0;box-sizing:border-box; scroll-behavior: smooth;}
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans'; display: flex; flex-direction: column; min-height: 100vh; }

  /* HEADER NA LOGO */
  header { 
    padding: 15px 5%; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    position: sticky; 
    top:0; 
    background:rgba(10,10,10,0.95); 
    backdrop-filter: blur(15px); 
    z-index: 100; 
    border-bottom: 1px solid var(--border); 
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo img { height: 45px; border-radius: 8px; } 
  .logo h1 { font-family: 'Syne'; font-size: 20px; color: var(--accent); letter-spacing: 1px; }
  .search-box { background: var(--card); border: 1px solid var(--border); padding: 10px 15px; border-radius: 8px; color: var(--text); width: 250px; outline: none; }
  .search-box:focus { border-color: var(--accent); }

  /* HERO NDOGO */
  .hero { padding: 40px 5% 20px; text-align: center; }
  .hero h2 { font-family: 'Syne'; font-size: 28px; color: var(--accent); text-shadow: 0 0 10px rgba(212,175,55,0.3); }
  .hero p { max-width: 600px; margin: 10px auto 0; opacity: 0.7; font-size: 14px; }

  /* SECTIONS */
  .container { padding: 20px 5% 40px; flex: 1; }
  .section-title { font-family: 'Syne'; font-size: 20px; margin-bottom: 15px; color: var(--accent); }

  /* GRID YA MOVIE NDOGO */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; } 
  .card { 
    background: var(--card); 
    border-radius: 10px; 
    overflow: hidden; 
    border: 1px solid var(--border); 
    transition: 0.3s; 
  }
  .card:hover { 
    transform: translateY(-5px); 
    border-color: var(--accent); 
    box-shadow: 0 5px 20px rgba(212,175,55,0.2); 
  }
  .card img { width: 100%; height: 220px; object-fit: cover; } 
  .card-body { padding: 10px; }
  .card h3 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { 
    display: block; 
    width: 100%; 
    background: linear-gradient(135deg, var(--accent), var(--accent2)); 
    color: #000; 
    text-align: center; 
    padding: 8px; 
    border-radius: 6px; 
    text-decoration: none; 
    font-weight: 700; 
    margin-top: 8px; 
    font-size: 12px; 
    transition: 0.2s;
  }
  .btn:hover { opacity: 0.9; }

  .loading { display: none; }

  /* FOOTER */
  footer {
    background: #000;
    border-top: 1px solid var(--border);
    text-align: center;
    padding: 25px 20px;
    margin-top: 40px;
  }
  footer p {
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  /* SCROLL TO TOP BUTTON */
  #scrollTop {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    display: none; /* Imefichwa mwanzoni */
    z-index: 999;
    box-shadow: 0 0 15px rgba(212,175,55,0.4);
    transition: 0.3s;
  }
  #scrollTop:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px rgba(212,175,55,0.6);
  }

  @media(max-width: 768px){ 
    .search-box{display:none} 
    .grid{grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));} 
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="https://i.postimg.cc/c1KDdXgf/file-0000052a471f4b1ee0c79fc058395.png" alt="TEKNOVA LOGO">
    <h1>MOVIES</h1>
  </div>
  <input type="text" id="search" class="search-box" placeholder="Tafuta movie...">
</header>

<section class="hero">
  <h2>Pakua Movies Bure</h2>
  <p>Movies zote mpya na za zamani. Download moja kwa moja kwenye simu yako bila shida.</p>
</section>

<div class="container">
  <h3 class="section-title">Movies Zote</h3>
  <div class="grid" id="movieGrid"></div>
</div>

<footer>
  <p>© NOVA SOFT 2026</p>
</footer>

<!-- SCROLL TO TOP BUTTON -->
<button id="scrollTop">↑</button>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDPZx7OPw2D6J533kNX-T302RoqPGAPz7k",
  authDomain: "teknova-c9d6e.firebaseapp.com",
  databaseURL: "https://teknova-c9d6e-default-rtdb.firebaseio.com",
  projectId: "teknova-c9d6e",
  storageBucket: "teknova-c9d6e.firebasestorage.app",
  messagingSenderId: "47075576420",
  appId: "1:47075576420:web:29d0588bee99558d866d71"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let allMovies = [];

function displayMovies(movies){
  const grid = document.getElementById('movieGrid');
  grid.innerHTML = '';
  if(movies.length === 0) { return; }
  movies.forEach(m => {
    const directLink = `https://drive.google.com/uc?export=download&id=${m.driveId}`;
    grid.innerHTML += `
      <div class="card">
        <img src="${m.poster}" alt="${m.title}" onerror="this.src='https://via.placeholder.com/150x220/121212/D4AF37?text=No+Image'">
        <div class="card-body">
          <h3>${m.title}</h3>
          <a href="${directLink}" download class="btn">⬇️ Download</a>
        </div>
      </div>
    `;
  });
}

db.ref('movies').on('value', (snapshot) => {
  allMovies = [];
  snapshot.forEach(child => { allMovies.push(child.val()); });
  displayMovies(allMovies);
});

// SEARCH FUNCTION
document.getElementById('search').addEventListener('keyup', (e) => {
  const term = e.target.value.toLowerCase();
  const filtered = allMovies.filter(m => m.title.toLowerCase().includes(term));
  displayMovies(filtered);
});

// SCROLL TO TOP JS
const scrollBtn = document.getElementById('scrollTop');
window.onscroll = function() {
  if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
    scrollBtn.style.display = "block";
  } else {
    scrollBtn.style.display = "none";
  }
};
scrollBtn.onclick = function() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
};
</script>
</body>
</html>
